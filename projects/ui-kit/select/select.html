<!-- The trigger opens the list on click; keyboard handling lives on the control inside it. -->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<div
  class="ui-select__trigger"
  cdkOverlayOrigin
  #origin="cdkOverlayOrigin"
  (mousedown)="onTriggerMousedown($event)"
  (click)="toggle($event)"
>
  @if (chipList().length) {
    <!-- The chips repeat the labels of the control for sighted users; their x buttons are for the mouse. -->
    <span class="ui-select__chips" aria-hidden="true" (click)="onChipsClick($event)">
      @for (chip of chipList(); track $index) {
        <ui-chip
          [removable]="!isDisabled() && !readonly()"
          [disabled]="isDisabled()"
          [label]="chip.label"
          (removed)="removeChip(chip.value)"
        >
          {{ chip.label }}
        </ui-chip>
      }
    </span>
  }
  <!-- uiComboboxControl sets the id, label and dynamic combobox ARIA of both controls. -->
  <!-- eslint-disable @angular-eslint/template/role-has-required-aria -->
  @if (searchable()) {
    <input
      #control
      uiComboboxControl
      type="text"
      role="combobox"
      class="ui-select__control ui-select__input"
      autocomplete="off"
      aria-autocomplete="list"
      aria-haspopup="listbox"
      [value]="listbox.isOpen() ? query() : displayLabel()"
      [placeholder]="displayLabel() || placeholder()"
      [attr.maxlength]="maxLength()"
      [disabled]="isDisabled()"
      [readOnly]="readonly()"
      (input)="onSearch($event)"
      (keydown)="onKeydown($event)"
      (blur)="onBlur()"
    />
  } @else {
    <button
      #control
      uiComboboxControl
      type="button"
      role="combobox"
      class="ui-select__control ui-select__button"
      aria-haspopup="listbox"
      [disabled]="isDisabled()"
      [attr.name]="name() || null"
      (keydown)="onKeydown($event)"
      (blur)="onBlur()"
    >
      <span
        class="ui-select__value"
        [class.ui-select__value--placeholder]="!displayLabel()"
        [class.ui-select__value--hidden]="chipList().length"
      >
        {{ displayLabel() || placeholder() }}
      </span>
    </button>
  }
  <!-- eslint-enable @angular-eslint/template/role-has-required-aria -->
  @if (showClear()) {
    <button
      type="button"
      class="ui-select__clear"
      [attr.aria-label]="labels().clear"
      [attr.title]="labels().clear"
      (click)="onClear($event)"
    >
      <ui-icon [icon]="clearIcon" />
    </button>
  }
  @if (loading()) {
    <ui-spinner class="ui-select__chevron ui-select__spinner" size="sm" decorative />
  } @else {
    <ui-icon class="ui-select__chevron" [icon]="chevron" />
  }
</div>

<ng-template [uiDropdownPanel]="origin" [open]="listbox.shown()" (closed)="close()">
  <ui-listbox [size]="size()">
    <ng-content />
  </ui-listbox>
</ng-template>
