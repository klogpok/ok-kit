@if (label()) {
  <label class="ui-form-field__label" [id]="labelId" [attr.for]="labelFor()">
    {{ label() }}
    @if (isRequired()) {
      <span class="ui-form-field__required" aria-hidden="true">*</span>
    }
  </label>
}

<!-- The box draws the control border when affixes are present (see form-field.scss). -->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<div class="ui-form-field__control" (click)="onBoxClick($event)">
  @if (hasPrefix()) {
    <span class="ui-form-field__prefix"><ng-content select="[uiPrefix]" /></span>
  }
  <ng-content />
  @if (hasSuffix()) {
    <span class="ui-form-field__suffix"><ng-content select="[uiSuffix]" /></span>
  }
</div>

<!--
  Always in the accessibility tree (never display: none), so that inserted errors are announced by
  the live region. While empty it is visually hidden and takes no space.
-->
<div
  class="ui-form-field__error"
  [class.ui-form-field__error--empty]="!hasError()"
  [id]="errorId"
  aria-live="polite"
>
  @if (showError()) {
    <ng-content select="ui-error" />
    @for (message of autoErrors(); track message) {
      <span class="ui-error">{{ message }}</span>
    }
  }
</div>

<div class="ui-form-field__hint" [id]="hintId" [hidden]="!hasHint() || hasError()">
  <ng-content select="ui-hint" />
  {{ hint() }}
</div>
